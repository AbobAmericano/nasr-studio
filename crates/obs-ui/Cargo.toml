[package]
name = "nsr-studio"
version = "0.1.0"
edition = "2024"
authors = [
    "abobamericano <abobamericano@gmail.com>",
    "antigravity"
]
description = "A rebuilt, reverse-engineered harness of OBS Studio written in Rust"
license = "GPL-3.0-or-later"
default-run = "nsr-studio"

[[bin]]
name = "nsr-studio"
path = "src/main.rs"

[dependencies]
obs-core = { path = "../obs-core" }
obs-capture = { path = "../obs-capture" }
obs-compositor = { path = "../obs-compositor" }
obs-encoder = { path = "../obs-encoder" }

eframe = { workspace = true }
egui = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
