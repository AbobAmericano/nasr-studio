[package]
name = "obs-cli"
description = "Command-line interface for obs-rs screen recording"
version.workspace = true
edition.workspace = true

[[bin]]
name = "obs-rs"
path = "src/main.rs"

[dependencies]
obs-core = { path = "../obs-core" }
obs-capture = { path = "../obs-capture" }
obs-compositor = { path = "../obs-compositor" }
obs-encoder = { path = "../obs-encoder" }
tokio = { workspace = true }
crossbeam-channel = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
