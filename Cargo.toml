[workspace]
members = [
    "crates/obs-core",
    "crates/obs-capture",
    "crates/obs-compositor",
    "crates/obs-encoder",
    "crates/obs-cli",
    "crates/obs-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = [
    "abobamericano <abobamericano@gmail.com>",
    "antigravity"
]
description = "A rebuilt, reverse-engineered harness of OBS Studio written in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/example/obs-rs"

[workspace.dependencies]
# --- GUI ---
eframe = { version = "0.29.1", default-features = true }
egui = "0.29.1"
# --- Core async & concurrency ---
tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
rayon = "1"

# --- GPU compositing ---
wgpu = { version = "22", features = ["wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"

# --- Capture ---
scrap = "0.5"
cpal = { version = "0.15", features = ["wasm-bindgen"] }

# --- Audio DSP ---
rubato = "0.15"

# --- Encoding ---
ffmpeg-next = "9.0"

# --- Timing ---
spin_sleep = "1"

# --- Utilities ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ringbuf = "0.3"
clap = { version = "4", features = ["derive"] }
image = "0.25"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 2    # Optimize frame processing, vectorization, and memory throughput
